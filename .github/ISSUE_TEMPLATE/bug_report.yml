name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, and what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension (if related)
      description: Name and version, e.g. "MangaDex 1.6.2". Please copy the exact error message shown in Browse › Extensions.
  - type: input
    id: version
    attributes:
      label: App version
      description: More › About
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: Linux Mint 21.3 Cinnamon
    validations:
      required: true
